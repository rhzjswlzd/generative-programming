<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementary Cellular Automata | 初等元胞自动机</title>
    <style>
        :root {
            --bg-base: #1c1c1e;
            --bg-surface: #252528;
            --bg-elevated: #2c2c30;
            --text-primary: #d8d8dc;
            --text-secondary: #a0a0a6;
            --text-muted: #6c6c72;
            --accent: #8a9fb5;
            --accent-hover: #9cb0c4;
            --border: #363638;
            --cell-on: #7da688;
            --radius-sm: 6px;
            --radius-md: 10px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'SF Pro Display', 'PingFang SC', -apple-system, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px;
        }
        
        .container {
            max-width: 960px;
            width: 100%;
        }
        
        header {
            margin-bottom: 32px;
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 500;
            margin-bottom: 6px;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .rule-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .rule-input label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        input[type="number"] {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            width: 80px;
            font-size: 0.9rem;
            text-align: center;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        button {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 18px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s ease-out;
        }
        
        button:hover {
            background: var(--bg-elevated);
        }
        
        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-base);
        }
        
        button.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        
        .presets {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .preset-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            background: var(--bg-elevated);
            border-color: transparent;
        }
        
        .preset-btn:hover {
            border-color: var(--border);
        }
        
        .canvas-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: inline-block;
        }
        
        canvas {
            display: block;
            border-radius: var(--radius-sm);
        }
        
        .rule-display {
            margin-top: 24px;
            padding: 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .rule-case {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .rule-pattern {
            display: flex;
            gap: 2px;
            margin-bottom: 4px;
        }
        
        .rule-cell {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            border: 1px solid var(--border);
        }
        
        .rule-cell.on {
            background: var(--cell-on);
            border-color: var(--cell-on);
        }
        
        .rule-cell.off {
            background: var(--bg-base);
        }
        
        .rule-result {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            margin-top: 4px;
            border: 1px solid var(--border);
        }
        
        .rule-result.on {
            background: var(--cell-on);
            border-color: var(--cell-on);
        }
        
        .rule-result.off {
            background: var(--bg-base);
        }
        
        .info {
            margin-top: 32px;
            padding: 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            max-width: 600px;
        }
        
        .info h2 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        
        .info p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 10px;
        }
        
        .info p:last-child {
            margin-bottom: 0;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .controls {
                gap: 8px;
            }
            
            button {
                padding: 8px 14px;
                font-size: 0.85rem;
            }
            
            .presets {
                gap: 6px;
            }
            
            .preset-btn {
                padding: 5px 10px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📐 Elementary Cellular Automata</h1>
            <p class="subtitle">初等元胞自动机 — Wolfram 的 256 条规则</p>
        </header>
        
        <div class="controls">
            <div class="rule-input">
                <label>规则</label>
                <input type="number" id="ruleInput" min="0" max="255" value="110">
            </div>
            <button class="primary" id="generate">生成</button>
            <button id="random">⚄ 随机规则</button>
        </div>
        
        <div class="presets">
            <button class="preset-btn" data-rule="30">Rule 30</button>
            <button class="preset-btn" data-rule="90">Rule 90</button>
            <button class="preset-btn" data-rule="110">Rule 110</button>
            <button class="preset-btn" data-rule="184">Rule 184</button>
            <button class="preset-btn" data-rule="250">Rule 250</button>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="rule-display" id="ruleDisplay"></div>
        
        <div class="info">
            <h2>📖 说明</h2>
            <p>
                Stephen Wolfram 定义的初等元胞自动机，基于 3 格邻域产生 8 种情况，
                每种情况对应 0 或 1，共有 2⁸ = 256 条规则。
            </p>
            <p>
                <strong>Rule 110</strong> 已被证明是图灵完备的。
                <strong>Rule 30</strong> 产生类随机图案，曾用于随机数生成。
            </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const CELL_SIZE = 3;
        const COLS = 300;
        const ROWS = 200;
        
        canvas.width = COLS * CELL_SIZE;
        canvas.height = ROWS * CELL_SIZE;
        
        const colors = {
            bg: '#1c1c1e',
            cell: '#7da688'
        };
        
        function getRuleBits(ruleNumber) {
            const bits = [];
            for (let i = 0; i < 8; i++) {
                bits.push((ruleNumber >> i) & 1);
            }
            return bits;
        }
        
        function displayRule(ruleNumber) {
            const bits = getRuleBits(ruleNumber);
            const container = document.getElementById('ruleDisplay');
            container.innerHTML = '';
            
            for (let i = 7; i >= 0; i--) {
                const pattern = i.toString(2).padStart(3, '0');
                const result = bits[i];
                
                const caseDiv = document.createElement('div');
                caseDiv.className = 'rule-case';
                
                const patternDiv = document.createElement('div');
                patternDiv.className = 'rule-pattern';
                
                for (let j = 0; j < 3; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'rule-cell ' + (pattern[j] === '1' ? 'on' : 'off');
                    patternDiv.appendChild(cell);
                }
                
                const resultDiv = document.createElement('div');
                resultDiv.className = 'rule-result ' + (result ? 'on' : 'off');
                
                const label = document.createElement('span');
                label.textContent = `${i} → ${result}`;
                
                caseDiv.appendChild(patternDiv);
                caseDiv.appendChild(resultDiv);
                caseDiv.appendChild(label);
                container.appendChild(caseDiv);
            }
        }
        
        function generate(ruleNumber) {
            const ruleBits = getRuleBits(ruleNumber);
            
            let row = Array(COLS).fill(0);
            row[Math.floor(COLS / 2)] = 1;
            
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = colors.cell;
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (row[x]) {
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
                
                const newRow = Array(COLS).fill(0);
                for (let x = 0; x < COLS; x++) {
                    const left = row[(x - 1 + COLS) % COLS];
                    const center = row[x];
                    const right = row[(x + 1) % COLS];
                    const pattern = (left << 2) | (center << 1) | right;
                    newRow[x] = ruleBits[pattern];
                }
                row = newRow;
            }
            
            displayRule(ruleNumber);
        }
        
        document.getElementById('generate').addEventListener('click', function() {
            const rule = parseInt(document.getElementById('ruleInput').value) || 0;
            generate(Math.max(0, Math.min(255, rule)));
        });
        
        document.getElementById('random').addEventListener('click', function() {
            const rule = Math.floor(Math.random() * 256);
            document.getElementById('ruleInput').value = rule;
            generate(rule);
        });
        
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const rule = parseInt(this.dataset.rule);
                document.getElementById('ruleInput').value = rule;
                generate(rule);
            });
        });
        
        generate(110);
    </script>
</body>
</html>
