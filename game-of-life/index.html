<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life | 康威生命游戏</title>
    <style>
        :root {
            --bg-base: #1c1c1e;
            --bg-surface: #252528;
            --bg-elevated: #2c2c30;
            --text-primary: #d8d8dc;
            --text-secondary: #a0a0a6;
            --text-muted: #6c6c72;
            --accent: #8a9fb5;
            --accent-hover: #9cb0c4;
            --border: #363638;
            --cell-alive: #7da688;
            --radius-sm: 6px;
            --radius-md: 10px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'SF Pro Display', 'PingFang SC', -apple-system, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
        }
        
        header {
            margin-bottom: 32px;
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 500;
            margin-bottom: 6px;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        button {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 18px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s ease-out;
        }
        
        button:hover {
            background: var(--bg-elevated);
        }
        
        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-base);
        }
        
        button.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        
        .canvas-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: inline-block;
        }
        
        canvas {
            display: block;
            border-radius: var(--radius-sm);
            cursor: crosshair;
        }
        
        .stats {
            margin-top: 16px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            display: flex;
            gap: 24px;
        }
        
        .info {
            margin-top: 32px;
            padding: 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            max-width: 600px;
        }
        
        .info h2 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        
        .info p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 10px;
        }
        
        .info p:last-child {
            margin-bottom: 0;
        }
        
        .rules-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        
        .rule-card {
            background: var(--bg-elevated);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-size: 0.8rem;
        }
        
        .rule-card .label {
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        
        .rule-card .value {
            color: var(--text-primary);
        }
        
        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .controls {
                gap: 8px;
            }
            
            button {
                padding: 8px 14px;
                font-size: 0.85rem;
            }
            
            .rules-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧬 Conway's Game of Life</h1>
            <p class="subtitle">康威生命游戏 — 点击绘制细胞，观察生命演化</p>
        </header>
        
        <div class="controls">
            <button class="primary" id="startStop">▶ 开始</button>
            <button id="step">⏭ 单步</button>
            <button id="random">⚄ 随机</button>
            <button id="clear">✕ 清空</button>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="stats">
            <span>代数 <strong id="generation">0</strong></span>
            <span>存活 <strong id="alive">0</strong></span>
        </div>
        
        <div class="info">
            <h2>📖 规则</h2>
            <p>每个细胞根据周围 8 个邻居的状态决定下一代的生死：</p>
            <div class="rules-grid">
                <div class="rule-card">
                    <div class="label">诞生</div>
                    <div class="value">死细胞 + 3 邻居 → 复活</div>
                </div>
                <div class="rule-card">
                    <div class="label">存活</div>
                    <div class="value">活细胞 + 2~3 邻居 → 存活</div>
                </div>
                <div class="rule-card">
                    <div class="label">死亡</div>
                    <div class="value">其他情况 → 死亡</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const CELL_SIZE = 8;
        const COLS = 80;
        const ROWS = 60;
        
        canvas.width = COLS * CELL_SIZE;
        canvas.height = ROWS * CELL_SIZE;
        
        const colors = {
            bg: '#1c1c1e',
            cell: '#7da688'
        };
        
        let grid = createGrid();
        let running = false;
        let generation = 0;
        let animationId = null;
        
        function createGrid() {
            return Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        }
        
        function countNeighbors(grid, x, y) {
            let count = 0;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = (x + dx + COLS) % COLS;
                    const ny = (y + dy + ROWS) % ROWS;
                    count += grid[ny][nx];
                }
            }
            return count;
        }
        
        function nextGeneration() {
            const newGrid = createGrid();
            let alive = 0;
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const neighbors = countNeighbors(grid, x, y);
                    if (grid[y][x]) {
                        newGrid[y][x] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                    } else {
                        newGrid[y][x] = (neighbors === 3) ? 1 : 0;
                    }
                    alive += newGrid[y][x];
                }
            }
            
            grid = newGrid;
            generation++;
            document.getElementById('generation').textContent = generation;
            document.getElementById('alive').textContent = alive;
        }
        
        function draw() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = colors.cell;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (grid[y][x]) {
                        ctx.fillRect(
                            x * CELL_SIZE + 1, 
                            y * CELL_SIZE + 1, 
                            CELL_SIZE - 2, 
                            CELL_SIZE - 2
                        );
                    }
                }
            }
        }
        
        function loop() {
            nextGeneration();
            draw();
            if (running) {
                animationId = setTimeout(loop, 100);
            }
        }
        
        document.getElementById('startStop').addEventListener('click', function() {
            running = !running;
            this.textContent = running ? '⏸ 暂停' : '▶ 开始';
            this.classList.toggle('primary', !running);
            if (running) loop();
        });
        
        document.getElementById('step').addEventListener('click', function() {
            if (!running) {
                nextGeneration();
                draw();
            }
        });
        
        document.getElementById('random').addEventListener('click', function() {
            grid = Array(ROWS).fill(null).map(() => 
                Array(COLS).fill(null).map(() => Math.random() < 0.3 ? 1 : 0)
            );
            generation = 0;
            document.getElementById('generation').textContent = 0;
            let alive = grid.flat().reduce((a, b) => a + b, 0);
            document.getElementById('alive').textContent = alive;
            draw();
        });
        
        document.getElementById('clear').addEventListener('click', function() {
            grid = createGrid();
            generation = 0;
            document.getElementById('generation').textContent = 0;
            document.getElementById('alive').textContent = 0;
            draw();
        });
        
        let isDrawing = false;
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; toggleCell(e); });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);
        canvas.addEventListener('mousemove', (e) => { if (isDrawing) toggleCell(e); });
        
        function toggleCell(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / CELL_SIZE);
            if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
                grid[y][x] = 1;
                let alive = grid.flat().reduce((a, b) => a + b, 0);
                document.getElementById('alive').textContent = alive;
                draw();
            }
        }
        
        // 初始化一个滑翔机
        grid[1][2] = 1; grid[2][3] = 1; grid[3][1] = 1; grid[3][2] = 1; grid[3][3] = 1;
        document.getElementById('alive').textContent = 5;
        draw();
    </script>
</body>
</html>
