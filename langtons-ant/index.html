<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langton's Ant | 兰顿蚂蚁</title>
    <style>
        :root {
            --bg-base: #1c1c1e;
            --bg-surface: #252528;
            --bg-elevated: #2c2c30;
            --text-primary: #d8d8dc;
            --text-secondary: #a0a0a6;
            --text-muted: #6c6c72;
            --accent: #8a9fb5;
            --accent-hover: #9cb0c4;
            --border: #363638;
            --cell-on: #c4b48a;
            --ant: #c49090;
            --radius-sm: 6px;
            --radius-md: 10px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'SF Pro Display', 'PingFang SC', -apple-system, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 24px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
        }
        
        header {
            margin-bottom: 32px;
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 500;
            margin-bottom: 6px;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        button {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 18px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s ease-out;
        }
        
        button:hover {
            background: var(--bg-elevated);
        }
        
        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-base);
        }
        
        button.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        
        select {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .canvas-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: inline-block;
        }
        
        canvas {
            display: block;
            border-radius: var(--radius-sm);
        }
        
        .stats {
            margin-top: 16px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        .info {
            margin-top: 32px;
            padding: 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            max-width: 600px;
        }
        
        .info h2 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        
        .info p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 10px;
        }
        
        .info p:last-child {
            margin-bottom: 0;
        }
        
        .rule {
            display: flex;
            gap: 24px;
            margin-top: 12px;
        }
        
        .rule-item {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        .rule-item span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        .rule-item .white {
            background: var(--bg-base);
            border: 1px solid var(--border);
        }
        
        .rule-item .black {
            background: var(--cell-on);
        }
        
        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .controls {
                gap: 8px;
            }
            
            button, select {
                padding: 8px 14px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐜 Langton's Ant</h1>
            <p class="subtitle">兰顿蚂蚁 — 二维图灵机，简单规则产生复杂行为</p>
        </header>
        
        <div class="controls">
            <button class="primary" id="startStop">▶ 开始</button>
            <button id="reset">↺ 重置</button>
            <select id="speed">
                <option value="1">速度 1x</option>
                <option value="10" selected>速度 10x</option>
                <option value="50">速度 50x</option>
                <option value="100">速度 100x</option>
            </select>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>
        
        <p class="stats">步数 <span id="steps">0</span></p>
        
        <div class="info">
            <h2>📖 规则</h2>
            <p>蚂蚁按照以下规则移动，每一步执行一次：</p>
            <div class="rule">
                <div class="rule-item">
                    <span class="white"></span>白格：右转 90°，变黑，前进
                </div>
                <div class="rule-item">
                    <span class="black"></span>黑格：左转 90°，变白，前进
                </div>
            </div>
            <p style="margin-top: 16px; color: var(--text-muted);">
                约 10,000 步后会出现规律性的对角线移动模式。
            </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const CELL_SIZE = 4;
        const COLS = 200;
        const ROWS = 150;
        
        canvas.width = COLS * CELL_SIZE;
        canvas.height = ROWS * CELL_SIZE;
        
        const DX = [0, 1, 0, -1];
        const DY = [-1, 0, 1, 0];
        
        let grid, ant, running, steps, animationId;
        
        const colors = {
            bg: '#1c1c1e',
            cell: '#c4b48a',
            ant: '#c49090'
        };
        
        function init() {
            grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
            ant = {
                x: Math.floor(COLS / 2),
                y: Math.floor(ROWS / 2),
                dir: 0
            };
            steps = 0;
            document.getElementById('steps').textContent = '0';
        }
        
        function step() {
            const { x, y, dir } = ant;
            
            if (grid[y][x] === 0) {
                ant.dir = (dir + 1) % 4;
                grid[y][x] = 1;
            } else {
                ant.dir = (dir + 3) % 4;
                grid[y][x] = 0;
            }
            
            ant.x = (ant.x + DX[ant.dir] + COLS) % COLS;
            ant.y = (ant.y + DY[ant.dir] + ROWS) % ROWS;
            
            steps++;
        }
        
        function draw() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = colors.cell;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (grid[y][x] === 1) {
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }
            
            ctx.fillStyle = colors.ant;
            ctx.beginPath();
            ctx.arc(
                ant.x * CELL_SIZE + CELL_SIZE / 2,
                ant.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            document.getElementById('steps').textContent = steps.toLocaleString();
        }
        
        function loop() {
            const speed = parseInt(document.getElementById('speed').value);
            for (let i = 0; i < speed; i++) {
                step();
            }
            draw();
            if (running) {
                animationId = requestAnimationFrame(loop);
            }
        }
        
        document.getElementById('startStop').addEventListener('click', function() {
            running = !running;
            this.textContent = running ? '⏸ 暂停' : '▶ 开始';
            this.classList.toggle('primary', !running);
            if (running) loop();
        });
        
        document.getElementById('reset').addEventListener('click', function() {
            running = false;
            document.getElementById('startStop').textContent = '▶ 开始';
            document.getElementById('startStop').classList.add('primary');
            if (animationId) cancelAnimationFrame(animationId);
            init();
            draw();
        });
        
        init();
        draw();
    </script>
</body>
</html>
